name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    # Trigger if pushing a v* tag, or if the push to main contains 'release' in the commit message, or manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && (
        contains(github.event.head_commit.message, 'release') ||
        contains(github.event.head_commit.message, 'Release') ||
        contains(github.event.head_commit.message, '[release]')
      ))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analysis
        run: flutter analyze --no-fatal-infos

      - name: Run test suite
        run: flutter test

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
            TAG="v${VERSION}+${BUILD}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Release tag determined: $TAG"

      - name: Build Android APK
        run: |
          # Build APK on GitHub Action runner
          flutter build apk --release --android-skip-build-dependency-validation || flutter build apk --debug --android-skip-build-dependency-validation

      - name: Locate and Rename APK
        run: |
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "mindbridge-${TAG}.apk"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk "mindbridge-${TAG}.apk"
          fi
          echo "APK asset prepared: mindbridge-${TAG}.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MindBridge AI ${{ env.TAG }}
          files: mindbridge-${{ env.TAG }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
